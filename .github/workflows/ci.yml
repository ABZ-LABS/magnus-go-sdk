name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  version:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches magnus.Version
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' client.go)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Version $version"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # A Go module has nothing to upload: the proxy fetches the tag from
      # GitHub the first time someone asks. Asking here, once the tests and the
      # version passed, is what makes pkg.go.dev list it without waiting.
      - name: Ask the Go module proxy for the tag
        run: GOPROXY=https://proxy.golang.org go list -m "github.com/ABZ-LABS/magnus-go-sdk@${GITHUB_REF_NAME}"
